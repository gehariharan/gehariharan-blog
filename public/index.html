<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Notes on technology, building, and the things worth thinking about by @gehariharan."
		/>
		<title>Gehariharan &mdash; Personal Blog</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="stylesheet" href="/styles.css" />
		<link rel="alternate" type="application/rss+xml" title="Gehariharan" href="/rss.xml" />
		<script>
			// Client-side fallback: If user skipped landing, redirect to /blog/ unless explicit override
			if (!window.location.search.includes("landing=true")) {
				if (document.cookie.split("; ").some((c) => c.startsWith("skip_landing=true"))) {
					window.location.replace("/blog/");
				}
			}
		</script>
	</head>
	<body class="landing-body">
		<main class="landing-container">
			<div class="landing-hero">
				<div class="avatar" aria-hidden="true">
					<img src="/avatar-square.jpg" alt="Hariharan Ragunathan" />
				</div>
				<div class="intro-block">
					<h1>Hi. I'm @gehariharan and you've found my blog!</h1>
					<p>
						I write about technology, building things, cycling, travel, and whatever else
						is on my mind. Long-form notes, no fixed schedule.
					</p>
					<p>Never miss a post: get new writing by email before it goes anywhere else.</p>

					<div class="subscribe">
						<form id="subscribe-form">
							<div class="form-row">
								<input id="email" name="email" type="email" autocomplete="email" placeholder="Type your email..." aria-label="Email address" required />
								<button type="submit">Subscribe</button>
							</div>
							<p class="status" id="status" aria-live="polite"></p>
						</form>

						<div class="landing-footer-links">
							<a class="telegram" id="telegram-link" href="#" aria-disabled="true">Or subscribe on Telegram &rarr;</a>
							<span class="dot-separator">&bull;</span>
							<button type="button" class="no-thanks-link" id="no-thanks-btn">No thanks, take me to the posts &rarr;</button>
						</div>
					</div>
				</div>
			</div>
		</main>

		<script>
			// Set 1-year skip cookie and go to blog
			document.getElementById("no-thanks-btn")?.addEventListener("click", () => {
				const maxAge = 60 * 60 * 24 * 365;
				document.cookie = `skip_landing=true; path=/; max-age=${maxAge}; SameSite=Lax`;
				window.location.href = "/blog/";
			});

			const form = document.querySelector("#subscribe-form");
			const status = document.querySelector("#status");

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				const email = new FormData(form).get("email");
				status.textContent = "Subscribing...";
				try {
					const response = await fetch("/api/subscribe", {
						method: "POST",
						headers: { "content-type": "application/json" },
						body: JSON.stringify({ email }),
					});
					const result = await response.json();
					status.textContent = result.message || result.error || "Something went wrong. Please try again.";
					if (response.ok) {
						// Auto-set cookie and navigate to blog after subscribing
						setTimeout(() => {
							const maxAge = 60 * 60 * 24 * 365;
							document.cookie = `skip_landing=true; path=/; max-age=${maxAge}; SameSite=Lax`;
							window.location.href = "/blog/";
						}, 2000);
					}
				} catch {
					status.textContent = "Unable to subscribe right now. Please try again.";
				}
			});
		</script>
	</body>
</html>
